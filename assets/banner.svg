<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="YV3507">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="52%" stop-color="#7C6CFF"/>
      <stop offset="100%" stop-color="#22D3A6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- terminal window -->
  <rect x="40" y="34" width="1120" height="232" rx="14" fill="#0d1117" fill-opacity="0.78" stroke="#1f2937"/>
  <path d="M40 48a14 14 0 0 1 14-14h1092a14 14 0 0 1 14 14v20H40z" fill="#161b22"/>
  <circle cx="68" cy="51" r="6" fill="#ff5f57"/>
  <circle cx="90" cy="51" r="6" fill="#febc2e"/>
  <circle cx="112" cy="51" r="6" fill="#28c840"/>
  <text x="600" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6b7280">yu@YV3507: ~/profile</text>

  <!-- prompt + whoami -->
  <text x="84" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#22D3A6">$ whoami</text>

  <!-- name -->
  <text x="80" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="74" font-weight="700" letter-spacing="1" fill="url(#accent)">YV3507</text>

  <!-- tagline -->
  <text x="84" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#9ca3af">宇 · AI / Rust / C++ / Embedded / LLM Agents</text>

  <!-- status line + blinking cursor -->
  <text x="84" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6b7280">$ building weird things that actually ship</text>
  <rect x="534" y="226" width="10" height="18" fill="#36BCF7">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- accent rule -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>
</svg>
